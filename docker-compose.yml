services:
  # --- DATABASE ---
  postgres:
    image: postgres:15
    container_name: agni-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # --- STRAPI BACKEND ---
  strapi:
    container_name: agni-strapi
    build: ./server
    image: strapi:latest
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "1337:1337"
    volumes:
      # Sync local backend code to container for hot-reloading
      - ./server:/opt/app
      # Prevent local node_modules from overwriting container's node_modules
      - /opt/app/node_modules
      - ./server/data:/opt/app/.tmp
      - ./server/public/uploads:/opt/app/public/uploads
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 1337
      APP_KEYS: ${APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_SSL: false
      DATABASE_NAME: ${DB_NAME}
      DATABASE_USERNAME: ${DB_USER}
      DATABASE_PASSWORD: ${DB_PASS}
      STRAPI_FIRSTNAME: ${STRAPI_FIRSTNAME}
      STRAPI_LASTNAME: ${STRAPI_LASTNAME}
      STRAPI_EMAIL: ${STRAPI_EMAIL}
      STRAPI_PASS: ${STRAPI_PASS}
      PUBLIC_URL: ${API_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}

  # --- VUE FRONTEND ---
  vue:
    container_name: agni-vue
    build: ./client
    restart: unless-stopped
    depends_on:
      - strapi
    ports:
      - "8080:8080"
    volumes:
      # Sync local frontend code to container for hot-reloading
      - ./client:/app
      # Prevent local node_modules from overwriting container's node_modules
      - /app/node_modules
    environment:
      VUE_APP_API_URL: ${API_URL} 
      # This ensures Vue's hot-reload works properly inside a Docker container
      CHOKIDAR_USEPOLLING: "true"

volumes:
  postgres-data: